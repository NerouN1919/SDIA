apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: wallet-service
  namespace: default
  labels:
    app: wallet-service
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: wallet-service
          image: registry.gitlab.com/payment-system/wallet-service:latest
          ports:
            - containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  strategy:
    canary:
      stableService: wallet-service-stable
      canaryService: wallet-service-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: payment-system-trafficsplit
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: wallet-service-sli
            args:
              - name: service
                value: wallet-service-canary
        - setWeight: 50
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: wallet-service-sli
            args:
              - name: service
                value: wallet-service-canary